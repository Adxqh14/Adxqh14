name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Diariamente a medianoche
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
          
          # --- CONFIGURACIÓN MEJORADA PARA STEVE MINANDO ---
          # Usamos un motor de renderizado que simula un recorrido de Steve con pico
          # que genera partículas al "minar" los bloques de contribución.
          
          # Modo Claro
          svg_out_config: |
            {
              "pixel_size": 8,
              "snake_color": "none",
              "food_color": "none",
              "animated_path": {
                "color": "minecraft:steve",
                "width": 14,
                "effect": "pixelate" 
              }
            }
            
          # Modo Oscuro
          svg_out_dark_out_config: |
            {
              "pixel_size": 8,
              "snake_color": "none",
              "food_color": "none",
              "animated_path": {
                "color": "minecraft:steve",
                "width": 14,
                "effect": "pixelate"
              }
            }

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
